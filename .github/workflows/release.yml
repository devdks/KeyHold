name: Publish release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/release.yml
      - package.json

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, sign and publish
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.20.0

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Check frontend types
        run: pnpm typecheck

      - name: Test Rust core
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build signed Windows updater
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $buildOutput = pnpm tauri:build --bundles nsis 2>&1
          $buildOutput | ForEach-Object { Write-Host $_ }
          if ($LASTEXITCODE -ne 0) {
            $tail = ($buildOutput | Select-Object -Last 40) -join "`n"
            $escaped = $tail.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Signed updater build failed::$escaped"
            exit 1
          }

      - name: Publish release, updater manifest and browser-friendly ZIP
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $tag = "v$version"
          $notesPath = ".github/release-notes/$tag.md"
          $notes = Get-Content $notesPath -Raw
          $installer = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          $signaturePath = "$($installer.FullName).sig"
          if (-not (Test-Path $signaturePath)) {
            throw "La signature de mise à jour est introuvable : $signaturePath"
          }

          $manifestPath = "latest.json"
          $downloadUrl = "https://github.com/${{ github.repository }}/releases/download/$tag/$([uri]::EscapeDataString($installer.Name))"
          $platform = [ordered]@{
            signature = (Get-Content $signaturePath -Raw).Trim()
            url = $downloadUrl
          }
          $manifest = [ordered]@{
            version = $version
            notes = $notes.Trim()
            pub_date = (Get-Date).ToUniversalTime().ToString("o")
            platforms = [ordered]@{
              "windows-x86_64" = $platform
              "windows-x86_64-nsis" = $platform
            }
          }
          $manifest | ConvertTo-Json -Depth 10 | Set-Content $manifestPath -Encoding utf8NoBOM

          $archive = "KeyHold_${version}_x64-setup.zip"
          Compress-Archive -Path $installer.FullName -DestinationPath $archive
          gh release create $tag `
            $installer.FullName `
            $signaturePath `
            $manifestPath `
            $archive `
            --target $env:GITHUB_SHA `
            --title "KeyHold $tag" `
            --notes-file $notesPath
